name: Code Quality & Linting

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    name: ESLint & TypeScript Check

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint --max-warnings 0
        continue-on-error: false

      - name: TypeScript type check
        run: pnpm tsc --noEmit
        continue-on-error: false

      - name: Check for console.log and debugger statements
        run: |
          if grep -r "console\.\(log\|warn\|error\|debug\)" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" src/; then
            echo "⚠️ Found console statements in production code"
            exit 1
          fi
        continue-on-error: true

      - name: Comment on PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Code quality checks passed!\n- ESLint ✓\n- TypeScript ✓'
            })
        continue-on-error: true

name: Auto Review & PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-review:
    runs-on: ubuntu-latest
    name: Automated PR Review

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.32.1

      - name: Basic PR Checks
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const checks = [];

            // Check 1: PR has description
            if (!pr.body || pr.body.trim().length === 0) {
              checks.push('❌ Missing PR description');
            } else {
              checks.push('✅ PR has description');
            }

            // Check 2: PR title is meaningful
            if (pr.title.length < 10) {
              checks.push('❌ PR title too short (min 10 chars)');
            } else {
              checks.push('✅ PR title is descriptive');
            }

            // Check 3: Has labels
            if (pr.labels.length === 0) {
              checks.push('⚠️ No labels assigned');
            } else {
              checks.push('✅ Labels assigned: ' + pr.labels.map(l => l.name).join(', '));
            }

            // Check 4: Check for large changes
            const additions = pr.additions || 0;
            const deletions = pr.deletions || 0;
            const total = additions + deletions;

            if (total > 500) {
              checks.push(`⚠️ Large PR: +${additions} -${deletions} changes`);
            } else {
              checks.push(`✅ PR size is reasonable: +${additions} -${deletions}`);
            }

            const comment = `## 🤖 Automated Review\n\n${checks.join('\n')}\n\n---\n*This is an automated check. Please address any issues before merge.*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Check for common issues
        run: |
          echo "🔍 Checking for common issues..."

          # Check for TODO/FIXME comments
          if grep -r "TODO\|FIXME" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" src/; then
            echo "⚠️ Found TODO/FIXME comments"
          fi

          # Check for console statements
          if grep -r "console\.\(log\|warn\)" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" src/; then
            echo "⚠️ Found console statements"
          fi

  pr-size-check:
    runs-on: ubuntu-latest
    name: PR Size Check

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const additions = pr.additions || 0;
            const deletions = pr.deletions || 0;
            const total = additions + deletions;

            if (total > 1000) {
              console.log(`⚠️ WARNING: This PR is very large (${total} changes)`);
              console.log('Consider breaking it into smaller PRs for easier review');
            }
